name: Sync Jobs from Google Sheets

on:
  schedule:
    # JST 09:00 = UTC 00:00
    - cron: "0 0 * * *"
    # JST 18:00 = UTC 09:00
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      companyKey:
        description: "Optional company key (omit for all companies)"
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync jobs from Google Sheets
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET secrets are required"
            exit 1
          fi

          COMPANY_KEY="${{ github.event.inputs.companyKey || '' }}"
          COMPANY_KEYS="sogo-career ns-haken ns-seishain wt hirayama shinnihon yokota-enterprise ut-aim wic takagi-kogyo nikken brexa-next jisha-haken"

          sync_one() {
            local key="$1"
            echo "=== Syncing ${key} ==="
            curl -fsS -X GET \
              "${APP_URL%/}/api/cron/job-sync?companyKey=${key}" \
              -H "Authorization: Bearer ${CRON_SECRET}"
            echo
          }

          if [ -n "$COMPANY_KEY" ]; then
            sync_one "$COMPANY_KEY"
            exit 0
          fi

          FAILED=0
          for key in $COMPANY_KEYS; do
            if ! sync_one "$key"; then
              echo "Failed: ${key}"
              FAILED=1
            fi
          done
          exit $FAILED
