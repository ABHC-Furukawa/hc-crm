name: Sync Call Leads from Google Sheets

on:
  schedule:
    # JST 08:00 = UTC 23:00 (previous day)
    - cron: "0 23 * * *"
    # JST 12:30 = UTC 03:30
    - cron: "30 3 * * *"
    # JST 18:30 = UTC 09:30
    - cron: "30 9 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync call leads from Google Sheets
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET secrets are required"
            exit 1
          fi

          curl -fsS -X GET \
            "${APP_URL%/}/api/cron/call-lead-sync" \
            -H "Authorization: Bearer ${CRON_SECRET}"
          echo
